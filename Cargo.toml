[workspace]
resolver = "2"
members = [
    "crates/beryl-nix",
    "crates/beryl-store",
    "crates/beryl-index",
    "crates/beryl-eval",
    "crates/beryl-build",
    "crates/beryl-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
beryl-nix = { path = "crates/beryl-nix" }
beryl-store = { path = "crates/beryl-store" }
beryl-index = { path = "crates/beryl-index" }
beryl-eval = { path = "crates/beryl-eval" }
beryl-build = { path = "crates/beryl-build" }

nix-rs-compat = { version = "0.1.2", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = "0.32"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
xz2 = "0.1"
zstd = "0.13"
tempfile = "3"
